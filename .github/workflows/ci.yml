name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xiaomi_ev
          MYSQL_USER: xiaomi_app
          MYSQL_PASSWORD: local_only_password
          MYSQL_ROOT_PASSWORD: local_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal_root_password"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test (with DB integration)
        run: npm test
        env:
          RUN_DB_INTEGRATION: "1"

      - name: Production build
        run: npm run build

      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high || true

  containers:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f server/Dockerfile -t xiaomi-car-api:ci .
      - name: Build portal image
        run: docker build -f apps/web/Dockerfile -t xiaomi-car-web:ci .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t xiaomi-car-admin:ci .
