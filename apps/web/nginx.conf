server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback: unknown paths resolve to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets; keep HTML short-lived for fast rollouts.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
